<!doctype html>

<style>
:root { --brand:#3c87f7; --brand-dark:#2563d9; --bg:#f6f7f9; --card:#fff; --text:#1c1d20; --muted:#60646c; --line:#e3e5e8; }
@media (prefers-color-scheme: dark) { :root { --bg:#0e0f11; --card:#1b1c1f; --text:#f1f2f4; --muted:#b0b4ba; --line:#2e3135; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif; overflow-wrap:anywhere; }
a { color:var(--brand); }
header { background:linear-gradient(135deg,#5a9cff,var(--brand) 45%,var(--brand-dark)); color:#fff; }
.bar { max-width:820px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:12px; }
.bar a { color:#fff; text-decoration:none; font-weight:700; }
.hero { max-width:820px; margin:0 auto; padding:24px 20px 40px; }
.hero h1 { margin:0 0 6px; font-size:clamp(26px,7vw,34px); line-height:1.2; }
.hero p { margin:0; opacity:.92; font-size:18px; }
main { max-width:820px; margin:-24px auto 40px; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:16px; }
@media (max-width:520px) { .card { padding:18px; } .app { flex-direction:column; } }
.app { display:flex; gap:18px; align-items:flex-start; }
.app img { width:72px; height:72px; border-radius:18px; flex:none; }
.app h2 { margin:0 0 6px; }
.links { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.btn { display:inline-block; padding:10px 16px; border-radius:12px; background:var(--brand); color:#fff; text-decoration:none; font-weight:600; }
.btn.alt { background:transparent; color:var(--brand); border:1px solid var(--brand); }
.langs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.langs a, .langs span { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); text-decoration:none; font-size:14px; }
.langs span { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
h2 { font-size:21px; margin:28px 0 8px; }
.card > h2:first-child { margin-top:0; }
li { margin:4px 0; }
footer { max-width:820px; margin:0 auto 40px; padding:0 20px; color:var(--muted); font-size:14px; }
</style>
